<main>
	<form name="contactForm" id="contactForm" action="FormProcess.php" method="post" accept-charset="UTF-8">
	<input type="hidden" name="subject" value="Lucas Korzeniewski Contact Submission">
	<input type="hidden" name="redirect" value="contactSent.htm">
	<table class="contact-table">
		<tr><th colspan="2">Contact Lucas Korzeniewski</th></tr>
		<tr><td class="contact-label"><span class="required">*</span> <label for="FirstName">First Name</label></td><td><input type="text" name="FirstName" id="FirstName" size="40" required></td></tr>
		<tr><td class="contact-label"><span class="required">*</span> <label for="LastName">Last Name</label></td><td><input type="text" name="LastName" id="LastName" size="40" required></td></tr>
		<tr><td class="contact-label"><label for="City">City</label></td><td><input type="text" name="City" id="City" size="40"></td></tr>
		<tr><td class="contact-label"><label for="ST">ST</label></td><td><select name="ST" id="ST">
			<option value="">None</option>
			<option value="FL" selected>Florida</option>
			<option value="AL">Alabama</option><option value="AK">Alaska</option><option value="AZ">Arizona</option><option value="AR">Arkansas</option>
			<option value="CA">California</option><option value="CO">Colorado</option><option value="CT">Connecticut</option><option value="DE">Delaware</option>
			<option value="GA">Georgia</option><option value="HI">Hawaii</option><option value="ID">Idaho</option><option value="IL">Illinois</option>
			<option value="IN">Indiana</option><option value="IA">Iowa</option><option value="KS">Kansas</option><option value="KY">Kentucky</option>
			<option value="LA">Louisiana</option><option value="ME">Maine</option><option value="MD">Maryland</option><option value="MA">Massachusetts</option>
			<option value="MI">Michigan</option><option value="MN">Minnesota</option><option value="MS">Mississippi</option><option value="MO">Missouri</option>
			<option value="MT">Montana</option><option value="NE">Nebraska</option><option value="NV">Nevada</option><option value="NH">New Hampshire</option>
			<option value="NJ">New Jersey</option><option value="NM">New Mexico</option><option value="NY">New York</option><option value="NC">North Carolina</option>
			<option value="ND">North Dakota</option><option value="OH">Ohio</option><option value="OK">Oklahoma</option><option value="OR">Oregon</option>
			<option value="PA">Pennsylvania</option><option value="RI">Rhode Island</option><option value="SC">South Carolina</option><option value="SD">South Dakota</option>
			<option value="TN">Tennessee</option><option value="TX">Texas</option><option value="UT">Utah</option><option value="VT">Vermont</option>
			<option value="VA">Virginia</option><option value="WA">Washington</option><option value="DC">Washington D.C.</option><option value="WV">West Virginia</option>
			<option value="WI">Wisconsin</option><option value="WY">Wyoming</option>
		</select></td></tr>
		<tr><td class="contact-label"><label for="Zip">Zip</label></td><td><input type="text" name="Zip" id="Zip" inputmode="numeric" pattern="[0-9]{5}" title="Five digit zip code" maxlength="5" size="10"></td></tr>
		<tr><td class="contact-label"><span class="required">*</span> <label for="Email">Email</label></td><td><input type="email" name="Email" id="Email" size="40" required></td></tr>
		<tr><td class="contact-label">Gender</td><td><label><input type="radio" name="Gender" id="GenderM" value="M"> M</label> <label><input type="radio" name="Gender" id="GenderF" value="F"> F</label></td></tr>
		<tr><td class="contact-label">Education</td><td><label><input type="checkbox" name="AS" value="AS"> AS</label> <label><input type="checkbox" name="BS" value="BS"> BS</label></td></tr>
		<tr><td class="contact-label"><span class="required">*</span> <label for="Comments">Comments</label></td><td><textarea name="Comments" id="Comments" cols="40" rows="5" required></textarea></td></tr>
		<tr><td class="contact-label"><input type="reset" value="Reset"></td><td><input type="submit" value="Submit"></td></tr>
	</table>
	</form>
